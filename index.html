*{
margin:0;
padding:0;

}

body{

/* =======================
BARRA SUPERIOR
======================= */

.top-panel{

display:flex;
align-items:center;
justify-content:center;
flex-wrap:wrap;
gap:12px;

padding:12px;

background:white;

box-shadow:0 2px 15px rgba(0,0,0,.08);

}

.separator{
width:10px;
height:30px;
border-left:1px solid #ddd;
}

/* FIGURAS */

.figure-btn{

width:55px;
height:55px;

border:none;

border-radius:16px;

background:#eef2f7;

font-size:24px;

cursor:pointer;

transition:.2s;
}

.figure-btn.active{

background:#22c55e;

color:white;

box-shadow:
0 0 0 3px #86efac,
0 0 14px rgba(34,197,94,.4);

}

/* COLORES */

.color-btn{

width:42px;
height:42px;

border-radius:50%;

cursor:pointer;

transition:.2s;

border:3px solid transparent;

}

.color-btn.active{

transform:scale(1.25);

border-color:#22c55e;

box-shadow:
0 0 10px rgba(34,197,94,.5);
}

.red-btn{
background:#ff4d4d;
}

.blue-btn{
background:#3b82f6;
}

.white-btn{
background:white;
border:2px solid #ccc;
}

/* REPRODUCCIÓN */
.play-control{display:flex;align-items:center;padding:10px 14px;background:#22c55e;border-radius:16px;font-weight:700}
#playBtn{border:0;background:none;color:white;font-size:18px;font-weight:700;cursor:pointer}
#playBtn.playing{background:#ef4444;border-radius:10px;padding:5px 9px}
.note.playing{z-index:2;animation:playGlow .22s ease-out}
.note.part-glow{filter:brightness(1.6);transform:scale(1.08)}
@keyframes playGlow{
0%{transform:scale(1)}
45%{transform:scale(1.12);filter:brightness(1.45);box-shadow:0 0 0 6px rgba(34,197,94,.35),0 0 30px 12px rgba(34,197,94,.75),0 10px 25px rgba(0,0,0,.15)}
100%{transform:scale(1);filter:brightness(1)}
}

/* METRONOMO */

.metro-control{

display:flex;

align-items:center;

gap:10px;

padding:10px 14px;

background:#FDBA2D;

border-radius:16px;

font-weight:700;

}

.metro-control button{

border:none;
background:none;

font-size:22px;

cursor:pointer;
}

#tempo{
width:140px;
}

#tempoValue{
min-width:40px;
font-weight:700;
}

/* =======================
ZONA JUEGO
======================= */

.main-panel{

flex:1;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

background:#F5FAFF;
}

.exercise-card{

width:98%;

max-width:1600px;

height:320px;

display:flex;

justify-content:center;

align-items:center;

background:white;

border-radius:35px;

box-shadow:
0 15px 50px rgba(0,0,0,.08);

padding:20px;
}

.sequence{

display:flex;

justify-content:center;

align-items:center;

gap:22px;

width:100%;
}

/* =======================
NOTAS
======================= */

.note{

width:130px;
height:130px;

border-radius:50%;

overflow:hidden;

position:relative;

border:6px solid white;

box-shadow:
0 10px 25px rgba(0,0,0,.15);

animation:pop .25s ease;

flex-shrink:0;
}

@keyframes pop{

from{
transform:scale(.75);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

.divider-v{

position:absolute;

left:50%;
top:0;

width:4px;
height:100%;

background:#222;

transform:translateX(-50%);
}

.divider-h{

position:absolute;

top:50%;
left:0;

width:100%;
height:4px;

background:#222;

transform:translateY(-50%);
}

/* =======================
PADS
======================= */

.bottom-panel{

display:flex;

justify-content:center;

align-items:center;

gap:90px;

padding:20px;

}

.pad-panel{

background:white;

padding:15px 30px;

border-radius:28px;

box-shadow:
0 10px 25px rgba(0,0,0,.12);

display:flex;

flex-direction:column;

align-items:center;
}

.pad{

width:140px;
height:140px;

border-radius:50%;

cursor:pointer;

transition:.15s;
}

.pad:hover{
transform:scale(1.08);
}

.pad:active{
transform:scale(.95);
}

.red-pad{

background:
radial-gradient(
circle at 30% 30%,
#ffb0b0,
#ff4545 60%,
#b80000
);

}

.blue-pad{

background:
radial-gradient(
circle at 30% 30%,
#b8d5ff,
#4184ff 60%,
#0036a8
);

}

.label{

margin-top:12px;

font-size:18px;

font-weight:700;
}

RESPONSIVE
======================= */

@media(max-width:1200px){

height:100px;

.sequence{

@media(max-width:900px){

}

.pad{
width:100px;
height:100px;
}

.bottom-panel{
gap:30px;
}

#tempo{
width:90px;
}
}

<script>

/* AUDIO */

const ctx =
new(window.AudioContext||
window.webkitAudioContext)();

function playTone(freq,duration=0.15){

const osc=ctx.createOscillator();
const gain=ctx.createGain();

osc.type="triangle";
osc.frequency.value=freq;

osc.connect(gain);
gain.connect(ctx.destination);

gain.gain.setValueAtTime(
0.4,
ctx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
ctx.currentTime+duration
);

osc.start();
osc.stop(ctx.currentTime+duration);
}

function playLow(){
playTone(120);
}

function playHigh(){
playTone(550);
}

function metronomeClick(){
  if (metronomeSoundEnabled) {
    playTone(1400,0.04);
  }
}

let metronomeSoundEnabled = true;

function updateMetronomeSoundButton() {
  const btn = document.getElementById("metroSoundBtn");
  if (!btn) return;

  btn.classList.remove("sound-on", "sound-off");

  if (metronomeSoundEnabled) {
    btn.classList.add("sound-on");
    btn.textContent = "🔊 ON";
    btn.title = "Sonido del metrónomo activado";
  } else {
    btn.classList.add("sound-off");
    btn.textContent = "🔇 OFF";
    btn.title = "Sonido del metrónomo desactivado";
  }
}

function toggleMetronomeSound() {
  metronomeSoundEnabled = !metronomeSoundEnabled;
  updateMetronomeSoundButton();
}


/* METRONOMO */

let metro=null;


function updateMetronomeButton() {
  const btn = document.getElementById("metronomeBtn");
  if (!btn) return;

  btn.classList.remove("metro-on", "metro-off");

  if (metro) {
    btn.classList.add("metro-on");
  } else {
    btn.classList.add("metro-off");
  }
}

function toggleMetronome() {
  if (metro) {
    clearInterval(metro);
    metro = null;
  } else {
    const interval = 60000 / currentTempo;
    metronomeClick();
    metro = setInterval(metronomeClick, interval);
  }

  updateMetronomeButton();
}



/* REPRODUCCIÓN */
let playbackTimer=null, subdivisionTimer=null, playbackIndex=0, isPlaying=false;

function beatMs(){return 60000/Number(document.getElementById("tempo").value);}
function soundColor(c){if(c==="red")playLow();else if(c==="blue")playHigh();}
function colorsOf(note){try{return JSON.parse(note.dataset.soundColors)}catch(e){return["white"]}}

function playCircle(i){
 const notes=document.querySelectorAll(".note");
 if(!notes.length)return;
 if(i>=notes.length)i=0;
 const note=notes[i], colors=colorsOf(note), partMs=beatMs()/colors.length;
 note.classList.add("playing");
 let k=0;
 function part(){
   if(!isPlaying)return;
   if(k>=colors.length){note.classList.remove("playing","part-glow");return}
   note.classList.add("part-glow");
   setTimeout(()=>note.classList.remove("part-glow"),Math.max(35,partMs*.65));
   soundColor(colors[k++]);
   subdivisionTimer=setTimeout(part,partMs);
 }
 part();
}

function nextCircle(){
 if(!isPlaying)return;
 playbackTimer=setTimeout(()=>{
   if(!isPlaying)return;
   playbackIndex++;
   const n=document.querySelectorAll(".note");
   if(playbackIndex>=n.length)playbackIndex=0;
   playCircle(playbackIndex);
   nextCircle();
 },beatMs());
}

function startPlayback(){
 if(isPlaying)return;
 const n=document.querySelectorAll(".note"); if(!n.length)return;
 isPlaying=true; playbackIndex=0;
 const b=document.getElementById("playBtn"); b.textContent="■ Stop"; b.classList.add("playing");
 if(!metro)metro=setInterval(metronomeClick,beatMs());
 playCircle(0); nextCircle();
}

function stopPlayback(){
 isPlaying=false;
 if(playbackTimer)clearTimeout(playbackTimer);
 if(subdivisionTimer)clearTimeout(subdivisionTimer);
 playbackTimer=null; subdivisionTimer=null;
 document.querySelectorAll(".note").forEach(n=>n.classList.remove("playing","part-glow"));
 const b=document.getElementById("playBtn"); b.textContent="▶ Play"; b.classList.remove("playing");
 if(metro){clearInterval(metro);metro=null;}
}

function togglePlayback(){if(isPlaying)stopPlayback();else startPlayback();}

document.getElementById("tempo").addEventListener("input",function(){
 document.getElementById("tempoValue").textContent=this.value;
 if(metro){clearInterval(metro);metro=setInterval(metronomeClick,beatMs());}
 if(isPlaying){
   if(playbackTimer)clearTimeout(playbackTimer);
   if(subdivisionTimer)clearTimeout(subdivisionTimer);
   document.querySelectorAll(".note").forEach(n=>n.classList.remove("playing","part-glow"));
   playCircle(playbackIndex); nextCircle();
 }
});

/* DATOS */

function randomColor(){

const colors=[];

document
.querySelectorAll(".color-btn.active")
.forEach(btn=>{

colors.push(btn.dataset.color);

});

const random=
colors[
Math.floor(
Math.random()*colors.length
)
];

if(random==="blue") return "#3b82f6";

return "#ffffff";

function randomFigure(){

const figures=[];

document
.querySelectorAll(".figure-btn.active")
.forEach(btn=>{

figures.push(
btn.dataset.figure
);

});

return figures[
Math.floor(
Math.random()*figures.length
)
];

/* FIGURAS */


let selectedTool = "red";
let blackDivisionMode = false;

function colorToHex(color) {
  if (color === "red") return "#ff4d4d";
  if (color === "blue") return "#3b82f6";
  return "#ffffff";
}

function getActiveColors() {
  const result = [];
  document.querySelectorAll(".color-btn.active").forEach(btn => {
    result.push(btn.dataset.color);
  });
  return result.length ? result : ["white"];
}

function getActiveFigures() {
  const result = [];
  document.querySelectorAll(".figure-btn.active").forEach(btn => {
    result.push(btn.dataset.figure);
  });
  return result.length ? result : ["negra"];
}

function randomColor() {
  const colors = getActiveColors();
  return colors[Math.floor(Math.random() * colors.length)];
}

function randomFigure() {
  const figures = getActiveFigures();
  return figures[Math.floor(Math.random() * figures.length)];
}

function getNoteColors(note) {
  try {
    const colors = JSON.parse(note.dataset.soundColors || "[]");
    return Array.isArray(colors) && colors.length ? colors : ["white"];
  } catch (e) {
    return ["white"];
  }
}

function setNoteColors(note, colors) {
  note.dataset.soundColors = JSON.stringify(colors);
  drawNote(note);
}

function editPart(note, index) {
  const colors = getNoteColors(note);
  colors[index] = selectedTool;
  setNoteColors(note, colors);
}

function addPart(note, index, total) {
  const part = document.createElement("div");
  part.className = "note-part";

  if (total === 2) {
    part.style.left = index === 0 ? "0" : "50%";
    part.style.top = "0";
    part.style.width = "50%";
    part.style.height = "100%";
  } else {
    const row = Math.floor(index / 2);
    const col = index % 2;
    part.style.left = col === 0 ? "0" : "50%";
    part.style.top = row === 0 ? "0" : "50%";
    part.style.width = "50%";
    part.style.height = "50%";
  }

  part.addEventListener("click", function(e) {
    e.stopPropagation();
    editPart(note, index);
  });

  note.appendChild(part);
}




function drawNote(note) {
  const colors = getNoteColors(note);
  const total = colors.length;

  note.innerHTML = "";
  note.style.background = "";
  note.style.backgroundImage = "";
  note.style.backgroundSize = "";
  note.style.backgroundPosition = "";
  note.style.backgroundRepeat = "";

  // NEGRA
  if (total === 1) {
    note.style.background = colorToHex(colors[0]);

    // Lápiz negro: una negra se divide en dos partes
    // conservando exactamente su color.
    if (selectedTool === "black") {
      const guide = document.createElement("div");
      guide.className = "division-guide division-guide-v";
      guide.title = "Dividir en dos";

      guide.addEventListener("click", function(e) {
        e.stopPropagation();
        const c = colors[0];
        setNoteColors(note, [c, c]);
      });

      note.appendChild(guide);
    }
    return;
  }

  // CORCHEA: dos mitades
  if (total === 2) {
    note.style.backgroundImage =
      `linear-gradient(to right,
        ${colorToHex(colors[0])} 0 50%,
        ${colorToHex(colors[1])} 50% 100%)`;

    const divider = document.createElement("div");
    divider.className = "divider-v";
    note.appendChild(divider);

    // GOMA: elimina la división y conserva el color
    // de la primera mitad (si es silencio, blanco).
    const erase = document.createElement("div");
    erase.className = "editable-divider editable-divider-v";
    erase.title = "Borrar división";

    erase.addEventListener("click", function(e) {
      e.stopPropagation();
      if (selectedTool === "white") {
        // Si ambas partes tienen el mismo color, lo conserva.
        // Si son diferentes, se toma la primera, que representa
        // la parte que queda al unirlas.
        setNoteColors(note, [colors[0]]);
      }
    });

    note.appendChild(erase);

    // LÁPIZ NEGRO: divide cada mitad horizontalmente.
    // Rojo -> rojo, rojo
    // Azul -> azul, azul
    // Blanco -> blanco, blanco
    if (selectedTool === "black") {
      const guide = document.createElement("div");
      guide.className = "division-guide division-guide-h";
      guide.title = "Dividir en cuatro";

      guide.addEventListener("click", function(e) {
        e.stopPropagation();

        setNoteColors(note, [
          colors[0], colors[0],
          colors[1], colors[1]
        ]);
      });

      note.appendChild(guide);
    }

    addPart(note, 0, 2);
    addPart(note, 1, 2);
    return;
  }

  // SEMICORCHEA: cuatro partes
  note.style.backgroundImage =
    `linear-gradient(to right,
        ${colorToHex(colors[0])} 0 50%,
        ${colorToHex(colors[1])} 50% 100%),
     linear-gradient(to right,
        ${colorToHex(colors[2])} 0 50%,
        ${colorToHex(colors[3])} 50% 100%)`;

  note.style.backgroundSize = "100% 50%, 100% 50%";
  note.style.backgroundPosition = "0 0, 0 100%";
  note.style.backgroundRepeat = "no-repeat";

  const v = document.createElement("div");
  v.className = "divider-v";

  const h = document.createElement("div");
  h.className = "divider-h";

  note.appendChild(v);
  note.appendChild(h);

  // Goma: quitar división vertical.
  const vHit = document.createElement("div");
  vHit.className = "editable-divider editable-divider-v";
  vHit.title = "Borrar división vertical";

  vHit.addEventListener("click", function(e) {
    e.stopPropagation();
    if (selectedTool !== "white") return;

    // Se conserva el color de cada fila.
    setNoteColors(note, [
      colors[0] === colors[1] ? colors[0] : colors[0],
      colors[2] === colors[3] ? colors[2] : colors[2]
    ]);
  });

  // Goma: quitar división horizontal.
  const hHit = document.createElement("div");
  hHit.className = "editable-divider editable-divider-h";
  hHit.title = "Borrar división horizontal";

  hHit.addEventListener("click", function(e) {
    e.stopPropagation();
    if (selectedTool !== "white") return;

    // Se conserva el color de cada columna.
    setNoteColors(note, [
      colors[0],
      colors[1]
    ]);
  });

  note.appendChild(vHit);
  note.appendChild(hHit);

  for (let i = 0; i < 4; i++) {
    addPart(note, i, 4);
  }
}

function generatePattern() {
  stopPlayback();

  const sequence = document.getElementById("sequence");
  sequence.innerHTML = "";

  for (let i = 0; i < 8; i++) {
    const note = document.createElement("div");
    note.className = "note";

    const figure = randomFigure();
    let colors;

    if (figure === "negra") {
      colors = [randomColor()];
    } else if (figure === "corchea") {
      colors = [randomColor(), randomColor()];
    } else {
      colors = [
        randomColor(),
        randomColor(),
        randomColor(),
        randomColor()
      ];
    }

    note.dataset.figure = figure;
    note.dataset.soundColors = JSON.stringify(colors);

    // Para una negra, el clic afecta al círculo completo.
    // En corcheas/semicorcheas, las zonas individuales interceptan el clic.
    note.addEventListener("click", function() {
      const current = getNoteColors(note);
      for (let i = 0; i < current.length; i++) {
        current[i] = selectedTool;
      }
      setNoteColors(note, current);
    });

    sequence.appendChild(note);
    drawNote(note);
  }
}

// Herramientas
function selectTool(tool) {
  selectedTool = tool;
  blackDivisionMode = (tool === "black");

  document.querySelectorAll(".edit-tool").forEach(btn => {
    btn.classList.remove("active");
  });

  if (tool === "red") {
    document.getElementById("redPencil").classList.add("active");
  } else if (tool === "blue") {
    document.getElementById("bluePencil").classList.add("active");
  } else if (tool === "white") {
    document.getElementById("eraser").classList.add("active");
  } else if (tool === "black") {
    document.getElementById("blackPencil").classList.add("active");
  }

  // Al cambiar de herramienta, redibujamos las notas para mostrar
  // las zonas de división disponibles.
  document.querySelectorAll(".note").forEach(note => drawNote(note));
}

document.getElementById("redPencil").addEventListener("click", function() {
  selectTool("red");
});

document.getElementById("bluePencil").addEventListener("click", function() {
  selectTool("blue");
});

document.getElementById("eraser").addEventListener("click", function() {
  selectTool("white");
});

document.getElementById("blackPencil").addEventListener("click", function() {
  selectTool("black");
});


let padsVisible = false;

function updatePadsButton() {
  const btn = document.getElementById("padsToggleBtn");
  const panel = document.querySelector(".bottom-panel");

  if (!btn || !panel) return;

  if (padsVisible) {
    panel.classList.remove("pads-hidden");
    btn.classList.remove("pads-off");
    btn.classList.add("pads-on");
    btn.textContent = "🔊 ON";
    btn.title = "Ocultar pads de sonido";
  } else {
    panel.classList.add("pads-hidden");
    btn.classList.remove("pads-on");
    btn.classList.add("pads-off");
    btn.textContent = "🔇 OFF";
    btn.title = "Mostrar pads de sonido";
  }
}

function togglePads() {
  padsVisible = !padsVisible;
  updatePadsButton();
}

// Generación inicial
generatePattern();
updatePadsButton();

// Estado inicial del metrónomo: apagado = amarillo.
updateMetronomeButton();

document.getElementById("startButton").addEventListener("click", startGame);

async function startGame() {
  const button = document.getElementById("startButton");
  const overlay = document.getElementById("startOverlay");
  const notice = document.getElementById("orientationNotice");
  const limitations = [];

  button.disabled = true;

  try {
    if (!document.documentElement.requestFullscreen) {
      limitations.push("pantalla completa");
    } else if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    }
  } catch (error) {
    console.warn("El navegador no permitió activar la pantalla completa.", error);
    limitations.push("pantalla completa");
  }

  try {
    if (!screen.orientation?.lock) {
      limitations.push("orientación horizontal");
    } else {
      await screen.orientation.lock("landscape");
    }
  } catch (error) {
    console.warn("El navegador no permitió bloquear la orientación horizontal.", error);
    limitations.push("orientación horizontal");
  }

  overlay.hidden = true;
  if (limitations.length) {
    notice.textContent =
      "Este navegador no permite solicitar " + limitations.join(" ni ") +
      ". El juego seguirá en horizontal; gira el dispositivo si hace falta.";
    notice.hidden = false;
  }
}
